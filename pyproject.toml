[project]
name = "wordle"
version = "0.1.0"
description = "Optimally solve Wordle problems using information theory."
authors = [{ name = "Andrew Wang", email = "siweiw9@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["click", "numpy", "pandas", "scipy", "tqdm", "wordfreq"]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pandas-stubs", "scipy-stubs", "types-tqdm"]

[project.urls]
Repository = "https://github.com/andrewwang247/wordle"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "S101", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
